<?xml version="1.0" encoding="utf-8"?>
<!-- 1EDGE mode mark: EDGE. The tile is the face - a solid block with the eyes and
     smile cut out of it, so the mark keeps its mass at 12px and whatever sits behind
     it shows through the features. Colour is baked in: no CSS filter chain. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <mask id="edgeFace">
    <rect x="2" y="2" width="20" height="20" rx="5" fill="#fff"/>
    <rect x="7.4" y="8.2" width="3.0" height="3.6" fill="#000"/><rect x="13.6" y="8.2" width="3.0" height="3.6" fill="#000"/><path d="M8.0 14.4a5.2 4.4 0 0 0 8.0 0" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round"/>
  </mask>
  <rect x="2" y="2" width="20" height="20" rx="5" fill="#7ED956" mask="url(#edgeFace)"/>
</svg>

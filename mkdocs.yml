site_name: 1EDGE Docs
site_description: Launch and trade coins with people, not bots. On Solana, Robinhood Chain and Arc.
site_url: https://docs.1edge.app
docs_dir: docs

theme:
  name: material
  logo: assets/brand/1edge_wordmark.png
  favicon: assets/brand/favicon.png
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tabs
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - navigation.path
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji
  - toc:
      permalink: false

copyright: "© 2026 1EDGE · <a href=\"https://1edge.app\">1edge.app</a> · <a href=\"https://1edge.app/nft?legal=terms\">Terms</a> · <a href=\"https://1edge.app/nft?legal=privacy\">Privacy</a> · <a href=\"https://1edge.app/nft?legal=disclaimer\">Risk</a>"

extra:
  generator: false
  social:
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/1EdgeHQ
      name: 1EDGE on X
    - icon: fontawesome/brands/telegram
      link: https://t.me/Join_1EDGE
      name: 1EDGE on Telegram

nav:
  - Home: index.md
  - Start:
      - start/index.md
      - Get your pass: start/get-your-pass.md
      - Your 1EDGE Wallet: start/wallet.md
      - Bring your pass: start/port.md
      - Chains: start/chains.md
      - Your profile: start/profile.md
  - Launch:
      - Every mode: launch/modes.md
      - Launch a coin: launch/launching.md
      - Open launches & rules: launch/open-launches.md
      - EDGEstocks: launch/stocks.md
      - Graduation: launch/graduation.md
  - Trade:
      - What the marks mean: trade/marks.md
      - Buy & sell: trade/buy-and-sell.md
      - Fees: trade/fees.md
      - Bridging: trade/bridging.md
      - Alpha Stream: trade/alpha-stream.md
      - Calls, PnL & cards: trade/calls-and-pnl.md
      - Find coins, follow traders: trade/discover.md
      - Other terminals: trade/other-terminals.md
  - Rewards:
      - Tiers & rebates: rewards/tiers.md
      - Referrals: rewards/referrals.md
      - Seasons: rewards/seasons.md
      - Earn on stocks: rewards/earn.md
  - Social:
      - EdgeSocial: social/feed.md
      - Trophy cabinet: social/trophy-cabinet.md
      - Notifications: social/notifications.md
      - Telegram bot: social/telegram-bot.md
      - Reporting & moderation: social/moderation.md
  - Help:
      - Support: help/support.md
      - Stay safe: help/safety.md
      - Troubleshooting: help/troubleshooting.md
      - Regions: help/regions.md
      - Contracts: help/contracts.md
      - Official links: help/links.md
      - What we track: help/what-we-track.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

[build]
  command = "pip install -r requirements.txt && mkdocs build"
  publish = "site"

[build.environment]
  PYTHON_VERSION = "3.12"

# Docs v2 (DOCS1010): every page of the old docs moves to its new home. The support assistant (backend SUPPORT_TOPICS)
# and search engines still link to the old paths, so each one answers 301, with and without the trailing slash.
